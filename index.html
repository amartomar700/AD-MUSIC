<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d13" />
  <title>AD MUSIC — AMAR TOMAR</title>
  <style>
    :root {
      --bg-color: #0b0d13;
      --accent-1: #00c6ff;
      --accent-2: #0072ff;
      --text-main: #ffffff;
      --text-muted: #8e8e93;
      --beat-scale: 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at top, #182032 0%, var(--bg-color) 75%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 12px 32px;
      position: relative;
      overflow-x: hidden;
    }

    /* === DJ LIGHT EFFECTS === */
    body.dj-active::before {
      content: "";
      position: fixed;
      inset: -50%;
      background: conic-gradient(
        from 0deg,
        rgba(0, 198, 255, 0.14),
        rgba(255, 0, 128, 0.14),
        rgba(112, 0, 255, 0.14),
        rgba(0, 255, 136, 0.14),
        rgba(0, 198, 255, 0.14)
      );
      animation: djSpin 10s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    .ad-brand-header,
    .uiverse-music-card,
    .ad-playlist-box {
      position: relative;
      z-index: 1;
    }

    body.dj-active .uiverse-music-card {
      animation: djCardGlow 3s ease-in-out infinite alternate;
      border-color: rgba(0, 198, 255, 0.45);
    }

    body.dj-active .uiverse-music-card.is-playing {
      animation: djCardBeat 1.4s ease-in-out infinite alternate;
    }

    body.dj-active .uiverse-music-card.is-playing .uiverse-volume-bars .uiverse-bar {
      background: linear-gradient(180deg, #ff007f, #00c6ff, #00ff88);
    }

    @keyframes djSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes djCardGlow {
      0%   { box-shadow: 0 0 18px rgba(0, 198, 255, 0.4), 0 18px 45px rgba(0, 0, 0, 0.75); }
      50%  { box-shadow: 0 0 22px rgba(255, 0, 128, 0.45), 0 18px 45px rgba(0, 0, 0, 0.75); }
      100% { box-shadow: 0 0 22px rgba(0, 255, 170, 0.4), 0 18px 45px rgba(0, 0, 0, 0.75); }
    }

    @keyframes djCardBeat {
      0%   { border-color: rgba(0, 198, 255, 0.85); }
      33%  { border-color: rgba(255, 0, 128, 0.85); }
      66%  { border-color: rgba(0, 255, 170, 0.85); }
      100% { border-color: rgba(168, 85, 247, 0.9); }
    }

    .ad-mini-pill.dj-on {
      background: linear-gradient(90deg, rgba(0, 198, 255, 0.28), rgba(255, 0, 128, 0.28));
      border-color: rgba(255, 0, 128, 0.55);
      color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 0, 128, 0.35);
    }

    .ad-brand-header {
      text-align: center;
      margin-bottom: 16px;
    }

    .ad-brand-title {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 3px;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .ad-brand-subtitle {
      font-size: 0.78rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      margin-top: 3px;
    }

    .uiverse-music-card {
      max-width: 440px;
      width: 100%;
      padding: 20px;
      border-radius: 32px;
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: border-color 0.25s ease;
    }

    .uiverse-track-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .uiverse-album-art {
      width: 68px;
      height: 68px;
      border-radius: 16px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      box-shadow: 0 4px 14px rgba(0, 114, 255, 0.35);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 1px;
      color: #fff;
      overflow: hidden;
      transition: transform 0.08s ease-out, box-shadow 0.08s ease-out;
    }

    .uiverse-album-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .uiverse-track-details {
      flex-grow: 1;
      overflow: hidden;
    }

    .uiverse-track-title {
      font-size: 1.1rem;
      font-weight: 600;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .uiverse-artist-name {
      font-size: 0.8rem;
      color: #d1d1d6;
      margin-top: 3px;
    }

    /* Real-time Beat Visualizer Bars */
    .uiverse-volume-bars {
      display: flex;
      align-items: flex-end;
      gap: 2.5px;
      width: 42px;
      height: 34px;
      flex-shrink: 0;
    }

    .uiverse-volume-bars .uiverse-bar {
      width: 3.5px;
      height: 6px;
      background: linear-gradient(180deg, #00c6ff, #0072ff);
      border-radius: 2px;
      transition: height 0.06s ease-out;
    }

    .uiverse-playback-controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .uiverse-time-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: #8e8e93;
      font-variant-numeric: tabular-nums;
    }

    .uiverse-progress-wrapper {
      padding: 8px 0;
      cursor: pointer;
      touch-action: none;
    }

    .uiverse-progress-bar {
      width: 100%;
      height: 6px;
      background-color: rgba(255, 255, 255, 0.14);
      border-radius: 4px;
      position: relative;
      transition: height 0.15s ease;
    }

    .uiverse-progress-wrapper:hover .uiverse-progress-bar {
      height: 8px;
    }

    .uiverse-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      border-radius: 4px;
      pointer-events: none;
    }

    .uiverse-progress-handle {
      position: absolute;
      top: 50%;
      left: 0%;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      background-color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(0, 198, 255, 0.8);
      pointer-events: none;
      transition: transform 0.15s ease;
    }

    .uiverse-progress-wrapper:hover .uiverse-progress-handle {
      transform: translate(-50%, -50%) scale(1.2);
    }

    .uiverse-button-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
    }

    .uiverse-control-button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: transparent;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s, color 0.2s;
      color: #ffffff;
      position: relative;
      flex-shrink: 0;
    }

    .uiverse-control-button:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: scale(1.06);
    }

    .uiverse-play-pause-button {
      background: linear-gradient(135deg, rgba(0, 198, 255, 0.22), rgba(0, 114, 255, 0.22));
      border: 1px solid rgba(0, 198, 255, 0.35);
      width: 52px;
      height: 52px;
    }

    .uiverse-control-button.active-state {
      color: var(--accent-1);
      background: rgba(0, 198, 255, 0.12);
    }

    .skip-label {
      font-size: 9px;
      font-weight: 700;
      margin-top: -2px;
      letter-spacing: -0.3px;
    }

    .repeat-one-badge {
      position: absolute;
      top: 5px;
      right: 5px;
      font-size: 9px;
      font-weight: 800;
      background: var(--accent-1);
      color: #000;
      border-radius: 50%;
      width: 13px;
      height: 13px;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .ad-extra-bar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .ad-volume-box {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .ad-vol-btn {
      background: none;
      border: none;
      color: #d1d1d6;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .ad-vol-btn:hover {
      color: #fff;
    }

    .ad-volume-slider {
      -webkit-appearance: none;
      appearance: none;
      flex-grow: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    .ad-volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent-1);
      cursor: pointer;
      box-shadow: 0 0 6px rgba(0, 198, 255, 0.7);
    }

    .ad-vol-pct {
      font-size: 0.74rem;
      color: var(--text-muted);
      min-width: 38px;
      text-align: right;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      transition: color 0.2s;
    }

    .ad-vol-pct.boosted {
      color: #00ff88;
      text-shadow: 0 0 8px rgba(0, 255, 136, 0.5);
    }

    .ad-pill-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      flex-wrap: wrap;
    }

    .ad-mini-pill {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e5e5ea;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 5px 9px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      flex: 1;
      text-align: center;
    }

    .ad-mini-pill:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .ad-mini-pill.active {
      background: rgba(0, 198, 255, 0.18);
      border-color: rgba(0, 198, 255, 0.45);
      color: var(--accent-1);
    }

    /* === 5-BAND EQUALIZER PANEL === */
    .ad-eq-panel {
      display: none;
      flex-direction: column;
      gap: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(0, 198, 255, 0.25);
      border-radius: 18px;
      padding: 12px;
      margin-top: 2px;
    }

    .ad-eq-panel.open {
      display: flex;
    }

    .ad-eq-presets {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .ad-eq-presets::-webkit-scrollbar {
      display: none;
    }

    .ad-eq-preset-btn {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #d1d1d6;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .ad-eq-preset-btn.active {
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
      color: #fff;
      border-color: transparent;
    }

    .ad-eq-sliders {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      text-align: center;
    }

    .ad-eq-band {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .ad-eq-db {
      font-size: 0.65rem;
      color: var(--accent-1);
      font-variant-numeric: tabular-nums;
    }

    .ad-eq-range {
      -webkit-appearance: none;
      appearance: none;
      width: 72px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      transform: rotate(-90deg);
      margin: 32px 0;
      cursor: pointer;
    }

    .ad-eq-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 6px rgba(0, 255, 136, 0.8);
    }

    .ad-eq-freq {
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    /* === PLAYLIST BOX === */
    .ad-playlist-box {
      max-width: 440px;
      width: 100%;
      margin-top: 16px;
      background: rgba(0, 0, 0, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 14px;
    }

    .ad-playlist-header {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 1.1px;
      color: var(--text-muted);
      padding: 2px 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ad-refresh-btn {
      background: rgba(0, 198, 255, 0.15);
      color: var(--accent-1);
      border: 1px solid rgba(0, 198, 255, 0.3);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.7rem;
      cursor: pointer;
    }

    .ad-filter-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 4px;
      scrollbar-width: none;
    }

    .ad-filter-bar::-webkit-scrollbar {
      display: none;
    }

    .ad-filter-chip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #d1d1d6;
      padding: 6px 13px;
      border-radius: 20px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .ad-filter-chip:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .ad-filter-chip.active {
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
      border-color: transparent;
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(0, 114, 255, 0.4);
    }

    .ad-search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 8px 12px;
      color: #fff;
      font-size: 0.84rem;
      outline: none;
      margin-bottom: 10px;
    }

    .ad-search-input:focus {
      border-color: var(--accent-1);
    }

    .ad-track-list {
      list-style: none;
      max-height: 270px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ad-track-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 0.88rem;
      gap: 8px;
    }

    .ad-track-item:hover {
      background: rgba(255, 255, 255, 0.07);
    }

    .ad-track-item.active {
      background: linear-gradient(90deg, rgba(0, 198, 255, 0.18), rgba(0, 114, 255, 0.18));
      border: 1px solid rgba(0, 198, 255, 0.35);
    }

    .ad-item-thumb {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 800;
      overflow: hidden;
    }

    .ad-item-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ad-cat-tag {
      font-size: 0.65rem;
      background: rgba(0, 198, 255, 0.14);
      color: var(--accent-1);
      padding: 2px 7px;
      border-radius: 8px;
      margin-left: 5px;
      font-weight: 600;
    }

    .ad-offline-badge {
      font-size: 0.62rem;
      background: rgba(0, 255, 136, 0.15);
      color: #00ff88;
      padding: 1px 6px;
      border-radius: 6px;
      margin-left: 4px;
      font-weight: 700;
    }

    .ad-item-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .ad-action-icon {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #8e8e93;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.76rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ad-action-icon:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .ad-action-icon.fav-active {
      color: #ff2d55;
      border-color: rgba(255, 45, 85, 0.4);
      background: rgba(255, 45, 85, 0.15);
    }

    .ad-action-icon.saved-active {
      color: #00ff88;
      border-color: rgba(0, 255, 136, 0.4);
      background: rgba(0, 255, 136, 0.14);
    }

    .ad-status-msg {
      text-align: center;
      font-size: 0.76rem;
      color: #00c6ff;
      margin-top: 8px;
      min-height: 16px;
    }
  </style>
</head>
<body class="dj-active">

  <header class="ad-brand-header">
    <div class="ad-brand-title">AD MUSIC</div>
    <div class="ad-brand-subtitle">AMAR TOMAR</div>
  </header>

  <div class="uiverse-music-card" id="musicCard">
    <div class="uiverse-track-info">
      <div class="uiverse-album-art" id="albumArt">AD</div>
      <div class="uiverse-track-details">
        <div class="uiverse-track-title" id="trackTitle">Syncing Drive...</div>
        <div class="uiverse-artist-name" id="artistName">AD Music</div>
      </div>
      <div class="uiverse-volume-bars" id="visualizerBars">
        <div class="uiverse-bar"></div>
        <div class="uiverse-bar"></div>
        <div class="uiverse-bar"></div>
        <div class="uiverse-bar"></div>
        <div class="uiverse-bar"></div>
        <div class="uiverse-bar"></div>
        <div class="uiverse-bar"></div>
        <div class="uiverse-bar"></div>
      </div>
    </div>

    <div class="uiverse-playback-controls">
      <div class="uiverse-time-info">
        <span id="currentTime">0:00</span>
        <span id="remainingTime">-0:00</span>
      </div>
      <div class="uiverse-progress-wrapper" id="progressWrapper">
        <div class="uiverse-progress-bar" id="progressBar">
          <div class="uiverse-progress-fill" id="progressFill"></div>
          <div class="uiverse-progress-handle" id="progressHandle"></div>
        </div>
      </div>

      <div class="uiverse-button-row">
        <button type="button" class="uiverse-control-button" id="shuffleBtn" title="Shuffle" aria-label="Shuffle">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M0 3.5A.5.5 0 0 1 .5 3H1c2.202 0 3.827 1.24 4.874 2.418.49.552.865 1.102 1.126 1.532.26-.43.636-.98 1.126-1.532C9.173 4.24 10.798 3 13 3v1c-1.798 0-3.173 1.01-4.126 2.082A9.6 9.6 0 0 0 7.556 8a9.6 9.6 0 0 0 1.317 1.918C9.828 10.99 11.204 12 13 12v1c-2.202 0-3.827-1.24-4.874-2.418A10.6 10.6 0 0 1 7 9.05c-.26.43-.636.98-1.126 1.532C4.827 11.76 3.202 13 1 13H.5a.5.5 0 0 1 0-1H1c1.798 0 3.173-1.01 4.126-2.082A9.6 9.6 0 0 0 6.444 8a9.6 9.6 0 0 0-1.317-1.918C4.172 5.01 2.796 4 1 4H.5a.5.5 0 0 1-.5-.5"/>
            <path d="M13 5.466V1.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384l-2.36 1.966a.25.25 0 0 1-.41-.192m0 9v-3.932a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384l-2.36 1.966a.25.25 0 0 1-.41-.192"/>
          </svg>
        </button>

        <button type="button" class="uiverse-control-button" id="prevBtn" title="Previous Track" aria-label="Previous">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
            <path d="M.5 3.5A.5.5 0 0 0 0 4v8a.5.5 0 0 0 1 0V8.753l6.267 3.636c.54.313 1.233-.066 1.233-.697v-2.94l6.267 3.636c.54.314 1.233-.065 1.233-.696V4.308c0-.63-.693-1.01-1.233-.696L8.5 7.248v-2.94c0-.63-.692-1.01-1.233-.696L1 7.248V4a.5.5 0 0 0-.5-.5"></path>
          </svg>
        </button>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxPBqalX_xM8xz7XSxtSGbyW72vyZn1lXz085X3Bd2MEY665dDrMdBk2syCDRi9pCVz/exec";

    const audio = new Audio();
    const audioCache = {};
    let tracks = [];
    let currentTrackId = null;
    let activeCategory = "All";
    let isPlaying = false;
    let isShuffle = false;
    let repeatMode = 0;
    let isSeeking = false;
    let isLoadingAudio = false;
    let lastVolume = 1.25;
    let crossfadeEnabled = true;

    // Favorites & Saved State (localStorage)
    let favoriteIds = new Set(JSON.parse(localStorage.getItem("ad_music_favs") || "[]"));
    let offlineSavedIds = new Set();

    function saveFavorites() {
      localStorage.setItem("ad_music_favs", JSON.stringify(Array.from(favoriteIds)));
    }

    function savePlaybackState() {
      if (!currentTrackId) return;
      localStorage.setItem("ad_music_last", JSON.stringify({
        id: currentTrackId,
        time: audio.currentTime || 0,
        cat: activeCategory
      }));
    }

    // === INDEXEDDB OFFLINE STORAGE ===
    const DB_NAME = "ADMusicOfflineDB";
    const STORE_NAME = "songs";

    function openOfflineDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: "id" });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function loadOfflineKeys() {
      try {
        const db = await openOfflineDB();
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAllKeys();
        req.onsuccess = () => {
          offlineSavedIds = new Set(req.result || []);
          renderPlaylist();
        };
      } catch (e) {}
    }

    async function getOfflineSong(id) {
      try {
        const db = await openOfflineDB();
        return new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, "readonly");
          const req = tx.objectStore(STORE_NAME).get(id);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (e) {
        return null;
      }
    }

    async function saveSongOffline(track, blob) {
      const db = await openOfflineDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        tx.objectStore(STORE_NAME).put({ id: track.id, title: track.title, blob });
        tx.oncomplete = () => {
          offlineSavedIds.add(track.id);
          resolve();
        };
        tx.onerror = () => reject(tx.error);
      });
    }

    async function removeOfflineSong(id) {
      const db = await openOfflineDB();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        tx.objectStore(STORE_NAME).delete(id);
        tx.oncomplete = () => {
          offlineSavedIds.delete(id);
          resolve();
        };
      });
    }

    // === WEB AUDIO API: 200% BOOSTER + 5-BAND EQ + REAL BEAT ANALYSER ===
    let audioCtx = null;
    let gainNode = null;
    let analyser = null;
    let eqFilters = [];
    let isAudioEngineReady = false;
    const eqFreqs = [60, 230, 910, 3600, 14000];
    const eqPresets = {
      normal: [0, 0, 0, 0, 0],
      bass:   [8, 5, 0, 1, 2],
      club:   [7, 4, -2, 4, 6],
      vocal:  [-2, 1, 5, 4, 1],
      treble: [-1, 0, 2, 6, 8]
    };

    function initAudioEngine() {
      if (isAudioEngineReady) {
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        return;
      }
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        const source = audioCtx.createMediaElementSource(audio);

        // 5-Band EQ BiquadFilters
        eqFilters = eqFreqs.map((freq, idx) => {
          const filter = audioCtx.createBiquadFilter();
          filter.type = idx === 0 ? "lowshelf" : (idx === 4 ? "highshelf" : "peaking");
          filter.frequency.value = freq;
          filter.Q.value = 1.2;
          filter.gain.value = 0;
          return filter;
        });

        gainNode = audioCtx.createGain();
        gainNode.gain.value = parseFloat(volumeSlider.value) || 1.25;

        const compressor = audioCtx.createDynamicsCompressor();
        compressor.threshold.setValueAtTime(-10, audioCtx.currentTime);
        compressor.knee.setValueAtTime(12, audioCtx.currentTime);
        compressor.ratio.setValueAtTime(6, audioCtx.currentTime);
        compressor.attack.setValueAtTime(0.005, audioCtx.currentTime);
        compressor.release.setValueAtTime(0.15, audioCtx.currentTime);

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;

        // Connect chain: source -> EQ bands -> gain -> compressor -> analyser -> speakers
        let lastNode = source;
        eqFilters.forEach(f => {
          lastNode.connect(f);
          lastNode = f;
        });
        lastNode.connect(gainNode);
        gainNode.connect(compressor);
        compressor.connect(analyser);
        analyser.connect(audioCtx.destination);

        isAudioEngineReady = true;
        startVisualizerLoop();
      } catch (e) {
        audio.volume = Math.min(1, parseFloat(volumeSlider.value) || 1);
      }
    }

    const visBars = document.querySelectorAll("#visualizerBars .uiverse-bar");
    function startVisualizerLoop() {
      if (!analyser) return;
      const dataArray = new Uint8Array(analyser.frequencyBinCount);

      function renderFrame() {
        requestAnimationFrame(renderFrame);
        if (!isPlaying) {
          visBars.forEach(b => b.style.height = "6px");
          albumArt.style.transform = "scale(1)";
          return;
        }
        analyser.getByteFrequencyData(dataArray);

        // Update 8 visualizer bars from frequency bins
        visBars.forEach((bar, i) => {
          const val = dataArray[i * 2] || 0;
          const h = Math.max(6, Math.round((val / 255) * 32));
          bar.style.height = `${h}px`;
        });

        // Bass pulse on Album Art & Card Glow
        const bass = (dataArray[0] + dataArray[1] + dataArray[2]) / 3;
        const beatNorm = bass / 255;
        if (document.body.classList.contains("dj-active")) {
          const scale = 1 + beatNorm * 0.08;
          albumArt.style.transform = `scale(${scale.toFixed(3)})`;
          musicCard.style.boxShadow = `0 0 ${Math.round(18 + beatNorm * 28)}px rgba(0, 198, 255, ${(0.35 + beatNorm * 0.55).toFixed(2)}), 0 0 ${Math.round(25 + beatNorm * 35)}px rgba(255, 0, 128, ${(0.25 + beatNorm * 0.5).toFixed(2)})`;
        } else {
          albumArt.style.transform = "scale(1)";
        }
      }
      renderFrame();
    }

    const speeds = [1, 1.25, 1.5, 2, 0.75];
    let speedIndex = 0;

    const sleepOptions = [0, 15, 30, 60];
    let sleepIndex = 0;
    let sleepTimeout = null;

    const musicCard = document.getElementById("musicCard");
    const albumArt = document.getElementById("albumArt");
    const trackTitle = document.getElementById("trackTitle");

    const remainingTimeEl = document.getElementById("remainingTime");
    const progressWrapper = document.getElementById("progressWrapper");
    const progressBar = document.getElementById("progressBar");
    const progressFill = document.getElementById("progressFill");
    const progressHandle = document.getElementById("progressHandle");

    const playPauseBtn = document.getElementById("playPauseBtn");
    const iconPlay = document.getElementById("iconPlay");
    const iconPause = document.getElementById("iconPause");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const rewind10Btn = document.getElementById("rewind10Btn");
    const forward10Btn = document.getElementById("forward10Btn");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const loopBtn = document.getElementById("loopBtn");
    const repeatOneBadge = document.getElementById("repeatOneBadge");

    const muteBtn = document.getElementById("muteBtn");
    const volIconHigh = document.getElementById("volIconHigh");
    const volIconMute = document.getElementById("volIconMute");
    const volumeSlider = document.getElementById("volumeSlider");
    const volPct = document.getElementById("volPct");
    const eqToggleBtn = document.getElementById("eqToggleBtn");
    const eqPanel = document.getElementById("eqPanel");
    const fadeBtn = document.getElementById("fadeBtn");
    const speedBtn = document.getElementById("speedBtn");
    const sleepBtn = document.getElementById("sleepBtn");
    const djBtn = document.getElementById("djBtn");

    const filterBar = document.getElementById("filterBar");
    const searchInput = document.getElementById("searchInput");
    const playlistEl = document.getElementById("playlistEl");
    const trackCount = document.getElementById("trackCount");
    const statusMsg = document.getElementById("statusMsg");
    const refreshBtn = document.getElementById("refreshBtn");

    djBtn.addEventListener("click", () => {
      const isOn = document.body.classList.toggle("dj-active");
      djBtn.textContent = isOn ? "DJ: ON" : "DJ: OFF";
      djBtn.classList.toggle("dj-on", isOn);
      if (!isOn) musicCard.style.boxShadow = "";
    });

    eqToggleBtn.addEventListener("click", () => {
      initAudioEngine();
      const open = eqPanel.classList.toggle("open");
      eqToggleBtn.classList.toggle("active", open);
    });

    fadeBtn.addEventListener("click", () => {
      crossfadeEnabled = !crossfadeEnabled;
      fadeBtn.textContent = crossfadeEnabled ? "Fade: 4s" : "Fade: Off";

    // EQ Preset & Slider Controls
    document.getElementById("eqPresets").addEventListener("click", (e) => {
      const btn = e.target.closest(".ad-eq-preset-btn");
      if (!btn) return;
      initAudioEngine();
      document.querySelectorAll(".ad-eq-preset-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      const values = eqPresets[btn.dataset.preset] || [0, 0, 0, 0, 0];
      document.querySelectorAll(".ad-eq-range").forEach((slider, idx) => {
        slider.value = values[idx];
        document.getElementById(`eqVal${idx}`).textContent = `${values[idx] > 0 ? "+" : ""}${values[idx]}dB`;
        if (eqFilters[idx]) eqFilters[idx].gain.value = values[idx];
      });
    });

    document.querySelectorAll(".ad-eq-range").forEach((slider) => {
      slider.addEventListener("input", (e) => {
        initAudioEngine();
        const idx = parseInt(e.target.dataset.band, 10);
        const val = parseFloat(e.target.value);
        document.getElementById(`eqVal${idx}`).textContent = `${val > 0 ? "+" : ""}${val}dB`;
        if (eqFilters[idx]) eqFilters[idx].gain.value = val;
        document.querySelectorAll(".ad-eq-preset-btn").forEach(b => b.classList.remove("active"));
      });
    });

    function formatTime(sec) {
      if (isNaN(sec) || !isFinite(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? "0" : ""}${s}`;
    }

    function getFilteredTracks() {
      const query = searchInput.value.trim().toLowerCase();
      return tracks.filter(t => {
        let catMatch = true;
        if (activeCategory === "Favorites") {
          catMatch = favoriteIds.has(t.id);
        } else if (activeCategory === "Offline") {
          catMatch = offlineSavedIds.has(t.id);
        } else if (activeCategory !== "All") {
          catMatch = (t.category || "").toLowerCase() === activeCategory.toLowerCase();
        }
        const textMatch = !query || t.title.toLowerCase().includes(query);
        return catMatch && textMatch;
      });
    }

    function renderFilterChips(folderCategories = []) {
      const trackCats = tracks.map(t => t.category).filter(Boolean);
      const allCats = Array.from(new Set(["All", "Favorites", "Offline", ...folderCategories, ...trackCats]));

      filterBar.innerHTML = "";
      allCats.forEach(cat => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `ad-filter-chip ${cat === activeCategory ? "active" : ""}`;
        btn.dataset.cat = cat;
        btn.textContent = cat === "Favorites" ? "❤️ Favorites" : (cat === "Offline" ? "📥 Offline" : cat);
        filterBar.appendChild(btn);
      });
    }

    function updateMediaSession(track) {
      if (!("mediaSession" in navigator) || !track) return;
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title,
          artist: `${track.artist || "AD Music"} • ${track.category || "Music"}`,
          album: "AD Music Cloud",
          artwork: track.thumb ? [{ src: track.thumb, sizes: "400x400", type: "image/jpeg" }] : []
        });

        navigator.mediaSession.setActionHandler("play", () => playPauseBtn.click());
        navigator.mediaSession.setActionHandler("pause", () => pauseTrack());
        navigator.mediaSession.setActionHandler("previoustrack", () => prevBtn.click());
        navigator.mediaSession.setActionHandler("nexttrack", () => nextBtn.click());
        navigator.mediaSession.setActionHandler("seekbackward", () => rewind10Btn.click());
        navigator.mediaSession.setActionHandler("seekforward", () => forward10Btn.click());
        navigator.mediaSession.setActionHandler("seekto", (details) => {
          if (details.seekTime !== undefined && audio.duration) {
            audio.currentTime = details.seekTime;
          }
        });
      } catch (e) {}
    }

    function callAppsScript(params = "") {
      return new Promise((resolve, reject) => {
        const callbackName = "adMusicCb_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
        const script = document.createElement("script");
        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error("Request timed out."));
        }, 25000);

        function cleanup() {
          clearTimeout(timeout);
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[callbackName] = (data) => {
          cleanup();
          resolve(data);
        };

        script.onerror = () => {
          cleanup();
          reject(new Error("Apps Script connection failed."));
        };

        const sep = SCRIPT_URL.includes("?") ? "&" : "?";
        script.src = `${SCRIPT_URL}${sep}${params ? params + "&" : ""}callback=${callbackName}`;
        document.body.appendChild(script);
      });
    }

    async function fetchDriveSongs() {
      statusMsg.style.color = "#00c6ff";
      statusMsg.textContent = "";
      trackCount.textContent = "Fetching from Drive...";
      playlistEl.innerHTML = `<li class="ad-track-item" style="justify-content:center; color:#8e8e93;">Loading playlist...</li>`;

      try {
        const data = await callAppsScript("");
        if (data && data.error) throw new Error(data.error);

        const list = Array.isArray(data) ? data : (data.tracks || []);
        const folderCats = Array.isArray(data.categories) ? data.categories : [];

        tracks = list;
        localStorage.setItem("ad_music_tracks_backup", JSON.stringify(tracks));
        renderFilterChips(folderCats);

        if (tracks.length === 0) {
          trackTitle.textContent = "Folder Empty";
          trackCount.textContent = "0 Tracks";
          playlistEl.innerHTML = `<li class="ad-track-item" style="justify-content:center; color:#8e8e93;">Is Drive folder me abhi koi audio file nahi hai.</li>`;
          return;
        }

        // Restore last played song if available
        const saved = JSON.parse(localStorage.getItem("ad_music_last") || "null");
        const initialTrack = (saved && tracks.find(t => t.id === saved.id)) || tracks[0];
        selectTrackUI(initialTrack);
      } catch (err) {
        // Offline Fallback from localStorage + IndexedDB
        const backup = JSON.parse(localStorage.getItem("ad_music_tracks_backup") || "[]");
        if (backup.length > 0) {
          tracks = backup;
          activeCategory = offlineSavedIds.size > 0 ? "Offline" : "All";
          renderFilterChips([]);
          selectTrackUI(tracks[0]);
          statusMsg.style.color = "#00ff88";
          statusMsg.textContent = "Offline Mode: Saved tracks ready.";
        } else {
          statusMsg.style.color = "#ff6b6b";
          statusMsg.textContent = err.message;
          trackTitle.textContent = "Connection Failed";
          trackCount.textContent = "0 Tracks";
          playlistEl.innerHTML = "";
        }
      }
    }

    function updateAlbumArt(thumbUrl) {
      if (thumbUrl) {
        albumArt.innerHTML = `<img src="${thumbUrl}" alt="Cover" onerror="this.parentElement.innerHTML='AD';" />`;
      } else {
        albumArt.innerHTML = "AD";
      }
    }

    function renderPlaylist() {
      const visibleTracks = getFilteredTracks();
      playlistEl.innerHTML = "";
      trackCount.textContent = `${activeCategory} (${visibleTracks.length} Tracks)`;

      if (visibleTracks.length === 0) {
        playlistEl.innerHTML = `<li class="ad-track-item" style="justify-content:center; color:#8e8e93;">Is section me abhi koi gaana nahi hai.</li>`;
        return;
      }

      visibleTracks.forEach((track) => {
        const isCurrent = track.id === currentTrackId;
        const isFav = favoriteIds.has(track.id);
        const isSaved = offlineSavedIds.has(track.id);

        const li = document.createElement("li");
        li.className = `ad-track-item ${isCurrent ? "active" : ""}`;
        const thumbHtml = track.thumb
          ? `<img src="${track.thumb}" alt="" onerror="this.parentElement.innerHTML='AD';" />`
          : `AD`;

        li.innerHTML = `
          <div class="ad-item-thumb">${thumbHtml}</div>
          <div style="flex-grow:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
            <div style="font-weight:600; overflow:hidden; text-overflow:ellipsis;">${track.title}</div>
            <div style="font-size:0.74rem; color:#8e8e93;">
              ${track.artist}
              <span class="ad-cat-tag">${track.category || "Music"}</span>
              ${isSaved ? `<span class="ad-offline-badge">Offline</span>` : ""}
            </div>
          </div>
          <div class="ad-item-actions">
            <button type="button" class="ad-action-icon fav-btn ${isFav ? "fav-active" : ""}" title="Favorite">${isFav ? "♥" : "♡"}</button>
            <button type="button" class="ad-action-icon save-btn ${isSaved ? "saved-active" : ""}" title="${isSaved ? "Saved Offline (Tap to remove)" : "Save Offline"}">${isSaved ? "✓" : "↓"}</button>
          </div>
        `;

        li.addEventListener("click", (e) => {
          if (e.target.closest(".fav-btn")) {
            e.stopPropagation();
            if (favoriteIds.has(track.id)) favoriteIds.delete(track.id);
            else favoriteIds.add(track.id);
            saveFavorites();
            renderPlaylist();
            return;
          }
          if (e.target.closest(".save-btn")) {
            e.stopPropagation();
            handleOfflineToggle(track, e.target.closest(".save-btn"));
            return;
          }
          loadAndPlayTrack(track);
        });

        playlistEl.appendChild(li);
      });
    }

    async function handleOfflineToggle(track, btn) {
      if (offlineSavedIds.has(track.id)) {
        await removeOfflineSong(track.id);
        statusMsg.style.color = "#8e8e93";
        statusMsg.textContent = `Removed "${track.title}" from offline storage.`;
        renderPlaylist();
        return;
      }

      try {
        btn.textContent = "…";
        statusMsg.style.color = "#00c6ff";
        statusMsg.textContent = `Saving "${track.title}" offline...`;
        const blob = await fetchTrackBlob(track);
        await saveSongOffline(track, blob);
        statusMsg.style.color = "#00ff88";
        statusMsg.textContent = `Saved "${track.title}" for offline playback!`;
        renderPlaylist();
      } catch (err) {
        btn.textContent = "↓";
        statusMsg.style.color = "#ff6b6b";
        statusMsg.textContent = "Offline save failed: " + err.message;
      }
    }

    async function fetchTrackBlob(track) {
      const offlineEntry = await getOfflineSong(track.id);
      if (offlineEntry && offlineEntry.blob) return offlineEntry.blob;

      const res = await callAppsScript(`fileId=${encodeURIComponent(track.id)}`);
      if (res.error) throw new Error(res.error);

      const byteChars = atob(res.base64);
      const byteNumbers = new Array(byteChars.length);
      for (let i = 0; i < byteChars.length; i++) {
        byteNumbers[i] = byteChars.charCodeAt(i);
      }
      return new Blob([new Uint8Array(byteNumbers)], { type: res.mimeType || "audio/webm" });
    }

    function selectTrackUI(track) {
      if (!track) return;
      currentTrackId = track.id;
      trackTitle.textContent = track.title;
      artistName.textContent = `${track.artist} • ${track.category || "Music"}`;
      updateAlbumArt(track.thumb);
      progressFill.style.width = "0%";
      progressHandle.style.left = "0%";
      currentTimeEl.textContent = "0:00";
      remainingTimeEl.textContent = "-0:00";
      renderPlaylist();
      updateMediaSession(track);
    }

    async function preloadTrack(track) {
      if (!track || audioCache[track.id]) return;
      try {
        const blob = await fetchTrackBlob(track);
        audioCache[track.id] = URL.createObjectURL(blob);
      } catch (e) {}
    }

    async function loadAndPlayTrack(track, resumeTime = 0) {
      if (!track || isLoadingAudio) return;
      initAudioEngine();
      pauseTrack();
      selectTrackUI(track);

      try {
        isLoadingAudio = true;
        statusMsg.style.color = "#00c6ff";
        statusMsg.textContent = offlineSavedIds.has(track.id) ? "Loading from offline storage..." : "Buffering audio from Drive...";

        let blobUrl = audioCache[track.id];
        if (!blobUrl) {
          const blob = await fetchTrackBlob(track);
          blobUrl = URL.createObjectURL(blob);
          audioCache[track.id] = blobUrl;
        }

        audio.src = blobUrl;
        audio.playbackRate = speeds[speedIndex];
        if (resumeTime > 0) audio.currentTime = resumeTime;

        // Smooth DJ Fade-In if crossfade is ON
        const targetGain = parseFloat(volumeSlider.value) || 1.25;
        if (crossfadeEnabled && isAudioEngineReady && gainNode && !audio.muted) {
          gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
          gainNode.gain.linearRampToValueAtTime(targetGain, audioCtx.currentTime + 1.5);
        }

        await audio.play();
        isPlaying = true;
        statusMsg.textContent = "";
        musicCard.classList.add("is-playing");
        iconPlay.style.display = "none";
        iconPause.style.display = "block";
        if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
        renderPlaylist();

        const nextTrack = getNextTrack();
        if (nextTrack) preloadTrack(nextTrack);
      } catch (err) {
        statusMsg.style.color = "#ff6b6b";
        statusMsg.textContent = "Play error: " + err.message;
      } finally {
        isLoadingAudio = false;
      }
    }

    function pauseTrack() {
      audio.pause();
      isPlaying = false;
      musicCard.classList.remove("is-playing");
      iconPlay.style.display = "block";
      iconPause.style.display = "none";
      if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
      savePlaybackState();
      renderPlaylist();
    }

    function getNextTrack() {
      const list = getFilteredTracks();
      if (list.length === 0) return null;
      const idx = list.findIndex(t => t.id === currentTrackId);

      if (isShuffle && list.length > 1) {
        let rand;
        do {
          rand = Math.floor(Math.random() * list.length);
        } while (rand === idx);
        return list[rand];
      }
      const nextIdx = idx === -1 ? 0 : (idx + 1) % list.length;
      return list[nextIdx];
    }

    function getPrevTrack() {
      const list = getFilteredTracks();
      if (list.length === 0) return null;
      const idx = list.findIndex(t => t.id === currentTrackId);
      const prevIdx = idx <= 0 ? list.length - 1 : idx - 1;
      return list[prevIdx];
    }

    filterBar.addEventListener("click", (e) => {
      const chip = e.target.closest(".ad-filter-chip");
      if (!chip) return;
      document.querySelectorAll(".ad-filter-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      activeCategory = chip.dataset.cat;
      renderPlaylist();
    });

    playPauseBtn.addEventListener("click", () => {
      if (tracks.length === 0) return;
      initAudioEngine();
      if (isPlaying) {
        pauseTrack();
      } else if (audio.src && audio.src.startsWith("blob:")) {
        audio.play().then(() => {
          isPlaying = true;
          musicCard.classList.add("is-playing");
          iconPlay.style.display = "none";
          iconPause.style.display = "block";
          if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
          renderPlaylist();
        });
      } else {
        const saved = JSON.parse(localStorage.getItem("ad_music_last") || "null");
        const current = tracks.find(t => t.id === currentTrackId) || getFilteredTracks()[0] || tracks[0];
        const resumeAt = (saved && saved.id === current.id && saved.time > 5) ? saved.time : 0;
        loadAndPlayTrack(current, resumeAt);
      }
    });

    prevBtn.addEventListener("click", () => {
      if (audio.currentTime > 4) {
        audio.currentTime = 0;
        return;
      }
      const prev = getPrevTrack();
      if (prev) loadAndPlayTrack(prev);
    });

    nextBtn.addEventListener("click", () => {
      const next = getNextTrack();
      if (next) loadAndPlayTrack(next);
    });

    rewind10Btn.addEventListener("click", () => {
      if (!audio.duration) return;
      audio.currentTime = Math.max(0, audio.currentTime - 10);
    });

    forward10Btn.addEventListener("click", () => {
      if (!audio.duration) return;
      audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
    });

    shuffleBtn.addEventListener("click", () => {
      isShuffle = !isShuffle;
      shuffleBtn.classList.toggle("active-state", isShuffle);
    });

    loopBtn.addEventListener("click", () => {
      repeatMode = (repeatMode + 1) % 3;
      audio.loop = repeatMode === 2;
      loopBtn.classList.toggle("active-state", repeatMode > 0);
      repeatOneBadge.style.display = repeatMode === 2 ? "flex" : "none";
      const labels = ["Repeat: Off", "Repeat: All", "Repeat: One"];
      loopBtn.title = labels[repeatMode];
    });

    function updateVolumeUI(val) {
      if (isAudioEngineReady && gainNode) {
        audio.volume = 1;
        gainNode.gain.setValueAtTime(val, audioCtx.currentTime);
      } else {
        audio.volume = Math.min(1, val);
      }
      volumeSlider.value = val;
      const pct = Math.round(val * 100);
      volPct.textContent = `${pct}%`;
      volPct.classList.toggle("boosted", pct > 100);

      const muted = val === 0 || audio.muted;
      volIconHigh.style.display = muted ? "none" : "block";
      volIconMute.style.display = muted ? "block" : "none";
    }

    volumeSlider.addEventListener("input", (e) => {
      initAudioEngine();
      const val = parseFloat(e.target.value);
      audio.muted = false;
      if (val > 0) lastVolume = val;
      updateVolumeUI(val);
    });

    muteBtn.addEventListener("click", () => {
      initAudioEngine();
      if (audio.muted || parseFloat(volumeSlider.value) === 0) {
        audio.muted = false;
        updateVolumeUI(lastVolume || 1.25);
      } else {
        lastVolume = parseFloat(volumeSlider.value);
        audio.muted = true;
        updateVolumeUI(0);
      }
    });

    speedBtn.addEventListener("click", () => {
      speedIndex = (speedIndex + 1) % speeds.length;
      const newSpeed = speeds[speedIndex];
      audio.playbackRate = newSpeed;
      speedBtn.textContent = `${newSpeed}x`;
      speedBtn.classList.toggle("active", newSpeed !== 1);
    });

    sleepBtn.addEventListener("click", () => {
      sleepIndex = (sleepIndex + 1) % sleepOptions.length;
      const mins = sleepOptions[sleepIndex];
      if (sleepTimeout) clearTimeout(sleepTimeout);

      if (mins === 0) {
        sleepBtn.textContent = "Sleep";
        sleepBtn.classList.remove("active");
      } else {
        sleepBtn.textContent = `${mins}m`;
        sleepBtn.classList.add("active");
        sleepTimeout = setTimeout(() => {
          pauseTrack();
          sleepIndex = 0;
          sleepBtn.textContent = "Sleep";
          sleepBtn.classList.remove("active");
          statusMsg.textContent = "Sleep timer ended. Playback paused.";
        }, mins * 60 * 1000);
      }
    });

    searchInput.addEventListener("input", renderPlaylist);

    refreshBtn.addEventListener("click", () => {
      pauseTrack();
      fetchDriveSongs();
    });

    let lastSaveTick = 0;
    audio.addEventListener("timeupdate", () => {
      if (!audio.duration || isSeeking) return;
      const percent = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = `${percent}%`;
      progressHandle.style.left = `${percent}%`;
      currentTimeEl.textContent = formatTime(audio.currentTime);
      remainingTimeEl.textContent = `-${formatTime(audio.duration - audio.currentTime)}`;

      // Save resume timestamp every 5 seconds
      if (Date.now() - lastSaveTick > 5000) {
        lastSaveTick = Date.now();
        savePlaybackState();
      }

      // DJ Crossfade Out in final 4 seconds
      const timeLeft = audio.duration - audio.currentTime;
      if (crossfadeEnabled && isAudioEngineReady && gainNode && !audio.muted && repeatMode !== 2 && timeLeft <= 4 && timeLeft > 0.2) {
        const baseGain = parseFloat(volumeSlider.value) || 1.25;
        const fadedGain = Math.max(0.05, baseGain * (timeLeft / 4));
        gainNode.gain.setValueAtTime(fadedGain, audioCtx.currentTime);
      }
    });

    audio.addEventListener("ended", () => {
      if (repeatMode === 2) return;
      const list = getFilteredTracks();
      const idx = list.findIndex(t => t.id === currentTrackId);
      if (repeatMode === 1 || idx < list.length - 1 || isShuffle) {
        const next = getNextTrack();
        if (next) loadAndPlayTrack(next);
      } else {
        pauseTrack();
      }
    });

    function updateSeekPosition(clientX) {
      if (!audio.duration) return;
      const rect = progressBar.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      const percent = ratio * 100;
      progressFill.style.width = `${percent}%`;
      progressHandle.style.left = `${percent}%`;
      currentTimeEl.textContent = formatTime(ratio * audio.duration);
      remainingTimeEl.textContent = `-${formatTime(audio.duration - ratio * audio.duration)}`;
      return ratio * audio.duration;
    }

    progressWrapper.addEventListener("pointerdown", (e) => {
      if (!audio.duration) return;
      isSeeking = true;
      progressWrapper.setPointerCapture(e.pointerId);
      updateSeekPosition(e.clientX);
    });

    progressWrapper.addEventListener("pointermove", (e) => {
      if (!isSeeking) return;
      updateSeekPosition(e.clientX);
    });

    progressWrapper.addEventListener("pointerup", (e) => {
      if (!isSeeking) return;
      const newTime = updateSeekPosition(e.clientX);
      if (newTime !== undefined) audio.currentTime = newTime;
      isSeeking = false;
    });

    document.addEventListener("keydown", (e) => {
      if (document.activeElement === searchInput) return;
      if (e.code === "Space") {
        e.preventDefault();
        playPauseBtn.click();
      } else if (e.code === "ArrowLeft") {
        rewind10Btn.click();
      } else if (e.code === "ArrowRight") {
        forward10Btn.click();
      } else if (e.key.toLowerCase() === "m") {
        muteBtn.click();
      }
    });

    loadOfflineKeys();
    fetchDriveSongs();
  </script>
</body>
</html>
