<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d13" />
  <title>AD MUSIC — AMAR TOMAR</title>
  <style>
    :root {
      --bg-color: #0b0d13;
      --accent-1: #00c6ff;
      --accent-2: #0072ff;
      --text-main: #ffffff;
      --text-muted: #8e8e93;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at top, #182032 0%, var(--bg-color) 75%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 14px;
    }

    .ad-brand-header {
      text-align: center;
      margin-bottom: 18px;
    }

    .ad-brand-title {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 3px;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .ad-brand-subtitle {
      font-size: 0.78rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      margin-top: 3px;
    }

    /*
      From Uiverse.io by Vosoone - https://uiverse.io/Vosoone/orange-dog-20
      MIT License, Copyright (c) Vosoone (Vosoone)
    */
    .uiverse-music-card {
      max-width: 440px;
      width: 100%;
      padding: 20px;
      border-radius: 32px;
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .uiverse-track-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .uiverse-album-art {
      width: 68px;
      height: 68px;
      border-radius: 16px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      box-shadow: 0 4px 14px rgba(0, 114, 255, 0.35);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 1px;
      color: #fff;
      overflow: hidden;
    }

    .uiverse-album-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .uiverse-track-details {
      flex-grow: 1;
      overflow: hidden;
    }

    .uiverse-track-title {
      font-size: 1.12rem;
      font-weight: 600;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .uiverse-artist-name {
      font-size: 0.82rem;
      color: #d1d1d6;
      margin-top: 3px;
    }

    .uiverse-volume-bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      width: 38px;
      height: 32px;
      flex-shrink: 0;
    }

    .uiverse-volume-bars .uiverse-bar {
      width: 3px;
      height: 6px;
      background: linear-gradient(180deg, #00c6ff, #0072ff);
      border-radius: 2px;
      animation: uiverse-bounce 0.8s infinite ease-in-out;
      animation-delay: var(--delay);
      animation-play-state: paused;
    }

    .uiverse-music-card.is-playing .uiverse-volume-bars .uiverse-bar {
      animation-play-state: running;
    }

    @keyframes uiverse-bounce {
      0%, 100% { height: 6px; }
      50% { height: 26px; }
    }

    .uiverse-playback-controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .uiverse-time-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: #8e8e93;
      font-variant-numeric: tabular-nums;
    }

    .uiverse-progress-wrapper {
      padding: 8px 0;
      cursor: pointer;
      touch-action: none;
    }

    .uiverse-progress-bar {
      width: 100%;
      height: 6px;
      background-color: rgba(255, 255, 255, 0.14);
      border-radius: 4px;
      position: relative;
      transition: height 0.15s ease;
    }

    .uiverse-progress-wrapper:hover .uiverse-progress-bar {
      height: 8px;
    }

    .uiverse-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      border-radius: 4px;
      pointer-events: none;
    }

    .uiverse-progress-handle {
      position: absolute;
      top: 50%;
      left: 0%;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      background-color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(0, 198, 255, 0.8);
      pointer-events: none;
      transition: transform 0.15s ease;
    }

    .uiverse-progress-wrapper:hover .uiverse-progress-handle {
      transform: translate(-50%, -50%) scale(1.2);
    }

    .uiverse-button-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
    }

    .uiverse-control-button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: transparent;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s, color 0.2s;
      color: #ffffff;
      position: relative;
      flex-shrink: 0;
    }

    .uiverse-control-button:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: scale(1.06);
    }

    .uiverse-play-pause-button {
      background: linear-gradient(135deg, rgba(0, 198, 255, 0.22), rgba(0, 114, 255, 0.22));
      border: 1px solid rgba(0, 198, 255, 0.35);
      width: 52px;
      height: 52px;
    }

    .uiverse-control-button.active-state {
      color: var(--accent-1);
      background: rgba(0, 198, 255, 0.12);
    }

    .skip-label {
      font-size: 9px;
      font-weight: 700;
      margin-top: -2px;
      letter-spacing: -0.3px;
    }

    .repeat-one-badge {
      position: absolute;
      top: 5px;
      right: 5px;
      font-size: 9px;
      font-weight: 800;
      background: var(--accent-1);
      color: #000;
      border-radius: 50%;
      width: 13px;
      height: 13px;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .ad-extra-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .ad-volume-box {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-grow: 1;
    }

    .ad-vol-btn {
      background: none;
      border: none;
      color: #d1d1d6;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .ad-vol-btn:hover {
      color: #fff;
    }

    .ad-volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      max-width: 115px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    .ad-volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--accent-1);
      cursor: pointer;
      box-shadow: 0 0 6px rgba(0, 198, 255, 0.7);
    }

    .ad-vol-pct {
      font-size: 0.72rem;
      color: var(--text-muted);
      min-width: 30px;
      font-variant-numeric: tabular-nums;
    }

    .ad-pill-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ad-mini-pill {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e5e5ea;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 5px 9px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ad-mini-pill:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .ad-mini-pill.active {
      background: rgba(0, 198, 255, 0.18);
      border-color: rgba(0, 198, 255, 0.45);
      color: var(--accent-1);
    }

    .ad-playlist-box {
      max-width: 440px;
      width: 100%;
      margin-top: 16px;
      background: rgba(0, 0, 0, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 14px;
    }

    .ad-playlist-header {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 1.1px;
      color: var(--text-muted);
      padding: 2px 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ad-refresh-btn {
      background: rgba(0, 198, 255, 0.15);
      color: var(--accent-1);
      border: 1px solid rgba(0, 198, 255, 0.3);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.7rem;
      cursor: pointer;
    }

    .ad-filter-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 4px;
      scrollbar-width: none;
    }

    .ad-filter-bar::-webkit-scrollbar {
      display: none;
    }

    .ad-filter-chip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #d1d1d6;
      padding: 6px 13px;
      border-radius: 20px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .ad-filter-chip:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .ad-filter-chip.active {
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
      border-color: transparent;
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(0, 114, 255, 0.4);
    }

    .ad-search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 8px 12px;
      color: #fff;
      font-size: 0.84rem;
      outline: none;
      margin-bottom: 10px;
    }

    .ad-search-input:focus {
      border-color: var(--accent-1);
    }

    .ad-track-list {
      list-style: none;
      max-height: 250px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ad-track-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 0.88rem;
      gap: 10px;
    }

    .ad-track-item:hover {
      background: rgba(255, 255, 255, 0.07);
    }

    .ad-track-item.active {
      background: linear-gradient(90deg, rgba(0, 198, 255, 0.18), rgba(0, 114, 255, 0.18));
      border: 1px solid rgba(0, 198, 255, 0.35);
    }

    .ad-item-thumb {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 800;
      overflow: hidden;
    }

    .ad-item-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ad-cat-tag {
      font-size: 0.65rem;
      background: rgba(0, 198, 255, 0.14);
      color: var(--accent-1);
      padding: 2px 7px;
      border-radius: 8px;
      margin-left: 6px;
      font-weight: 600;
    }

    .ad-track-item-meta {
      font-size: 0.74rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .ad-status-msg {
      text-align: center;
      font-size: 0.76rem;
      color: #00c6ff;
      margin-top: 8px;
      min-height: 16px;
    }
  </style>
</head>
<body>

  <header class="ad-brand-header">
    <div class="ad-brand-title">AD MUSIC</div>
    <div class="ad-brand-subtitle">GOOGLE DRIVE CLOUD PLAYER</div>
  </header>

  <div class="uiverse-music-card" id="musicCard">
    <div class="uiverse-track-info">
      <div class="uiverse-album-art" id="albumArt">AD</div>
      <div class="uiverse-track-details">
        <div class="uiverse-track-title" id="trackTitle">Syncing Drive...</div>
        <div class="uiverse-artist-name" id="artistName">AD Music</div>
      </div>
      <div class="uiverse-volume-bars">
        <div class="uiverse-bar" style="--delay:0s"></div>
        <div class="uiverse-bar" style="--delay:0.1s"></div>
        <div class="uiverse-bar" style="--delay:0.2s"></div>
        <div class="uiverse-bar" style="--delay:0.3s"></div>
        <div class="uiverse-bar" style="--delay:0.4s"></div>
        <div class="uiverse-bar" style="--delay:0.5s"></div>
        <div class="uiverse-bar" style="--delay:0.6s"></div>
        <div class="uiverse-bar" style="--delay:0.7s"></div>
      </div>
    </div>

    <div class="uiverse-playback-controls">
      <div class="uiverse-time-info">
        <span id="currentTime">0:00</span>
        <span id="remainingTime">-0:00</span>
      </div>
      <div class="uiverse-progress-wrapper" id="progressWrapper">
        <div class="uiverse-progress-bar" id="progressBar">
          <div class="uiverse-progress-fill" id="progressFill"></div>
          <div class="uiverse-progress-handle" id="progressHandle"></div>
        </div>
      </div>

      <div class="uiverse-button-row">
        <button type="button" class="uiverse-control-button" id="shuffleBtn" title="Shuffle" aria-label="Shuffle">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M0 3.5A.5.5 0 0 1 .5 3H1c2.202 0 3.827 1.24 4.874 2.418.49.552.865 1.102 1.126 1.532.26-.43.636-.98 1.126-1.532C9.173 4.24 10.798 3 13 3v1c-1.798 0-3.173 1.01-4.126 2.082A9.6 9.6 0 0 0 7.556 8a9.6 9.6 0 0 0 1.317 1.918C9.828 10.99 11.204 12 13 12v1c-2.202 0-3.827-1.24-4.874-2.418A10.6 10.6 0 0 1 7 9.05c-.26.43-.636.98-1.126 1.532C4.827 11.76 3.202 13 1 13H.5a.5.5 0 0 1 0-1H1c1.798 0 3.173-1.01 4.126-2.082A9.6 9.6 0 0 0 6.444 8a9.6 9.6 0 0 0-1.317-1.918C4.172 5.01 2.796 4 1 4H.5a.5.5 0 0 1-.5-.5"/>
            <path d="M13 5.466V1.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384l-2.36 1.966a.25.25 0 0 1-.41-.192m0 9v-3.932a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384l-2.36 1.966a.25.25 0 0 1-.41-.192"/>
          </svg>
        </button>

        <button type="button" class="uiverse-control-button" id="prevBtn" title="Previous Track" aria-label="Previous">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
            <path d="M.5 3.5A.5.5 0 0 0 0 4v8a.5.5 0 0 0 1 0V8.753l6.267 3.636c.54.313 1.233-.066 1.233-.697v-2.94l6.267 3.636c.54.314 1.233-.065 1.233-.696V4.308c0-.63-.693-1.01-1.233-.696L8.5 7.248v-2.94c0-.63-.692-1.01-1.233-.696L1 7.248V4a.5.5 0 0 0-.5-.5"></path>
          </svg>
        </button>

        <button type="button" class="uiverse-control-button" id="rewind10Btn" title="Rewind 10s" aria-label="Rewind 10 seconds">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M8 3a5 5 0 1 1-4.546 2.914.5.5 0 0 0-.908-.417A6 6 0 1 0 8 2z"/>
            <path d="M8 4.466V.534a.25.25 0 0 0-.41-.192L5.23 2.308a.25.25 0 0 0 0 .384l2.36 1.966A.25.25 0 0 0 8 4.466"/>
          </svg>
          <span class="skip-label">-10s</span>
        </button>

        <button type="button" class="uiverse-control-button uiverse-play-pause-button" id="playPauseBtn" title="Play / Pause" aria-label="Play or Pause">
          <svg id="iconPlay" xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="currentColor" viewBox="0 0 16 16">
            <path d="M11.596 8.697l-6.363 3.692c-.54.314-1.233-.065-1.233-.696V4.308c0-.63.693-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393"></path>
          </svg>
          <svg id="iconPause" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="currentColor" viewBox="0 0 16 16">
            <path d="M5.5 3.5A1.5 1.5 0 0 1 7 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5m5 0A1.5 1.5 0 0 1 12 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5"></path>
          </svg>
        </button>

        <button type="button" class="uiverse-control-button" id="forward10Btn" title="Forward 10s" aria-label="Forward 10 seconds">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z"/>
            <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466"/>
          </svg>
          <span class="skip-label">+10s</span>
        </button>

        <button type="button" class="uiverse-control-button" id="nextBtn" title="Next Track" aria-label="Next">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
            <path d="M15.5 3.5a.5.5 0 0 1 .5.5v8a.5.5 0 0 1-1 0V8.753l-6.267 3.636c-.54.313-1.233-.066-1.233-.697v-2.94l-6.267 3.636C.693 12.703 0 12.324 0 11.693V4.308c0-.63.693-1.01 1.233-.696L7.5 7.248v-2.94c0-.63.693-1.01 1.233-.696L15 7.248V4a.5.5 0 0 1 .5-.5"></path>
          </svg>
        </button>

        <button type="button" class="uiverse-control-button" id="loopBtn" title="Repeat: Off" aria-label="Repeat Mode">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
            <path d="M11 5.466V4H5a4 4 0 0 0-3.584 5.777.5.5 0 1 1-.896.446A5 5 0 0 1 5 3h6V1.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384l-2.36 1.966a.25.25 0 0 1-.41-.192m3.81.086a.5.5 0 0 1 .67.225A5 5 0 0 1 11 13H5v1.466a.25.25 0 0 1-.41.192l-2.36-1.966a.25.25 0 0 1 0-.384l2.36-1.966a.25.25 0 0 1 .41.192V12h6a4 4 0 0 0 3.585-5.777.5.5 0 0 1 .225-.67Z"/>
          </svg>
          <span class="repeat-one-badge" id="repeatOneBadge">1</span>
        </button>
      </div>
    </div>

    <div class="ad-extra-bar">
      <div class="ad-volume-box">
        <button type="button" class="ad-vol-btn" id="muteBtn" title="Mute / Unmute" aria-label="Mute">
          <svg id="volIconHigh" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
            <path d="M11.536 14.01A8.47 8.47 0 0 0 14.026 8a8.47 8.47 0 0 0-2.49-6.01l-.708.707A7.48 7.48 0 0 1 13.025 8c0 2.071-.84 3.946-2.197 5.303z"/>
            <path d="M10.121 12.596A6.48 6.48 0 0 0 12.025 8a6.48 6.48 0 0 0-1.904-4.596l-.707.707A5.48 5.48 0 0 1 11.025 8a5.48 5.48 0 0 1-1.61 3.89z"/>
            <path d="M8.707 11.182A4.5 4.5 0 0 0 10.025 8a4.5 4.5 0 0 0-1.318-3.182L8 5.525A3.5 3.5 0 0 1 9.025 8 3.5 3.5 0 0 1 8 10.475zM6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A.5.5 0 0 1 1 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06"/>
          </svg>
          <svg id="volIconMute" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="#ff6b6b" viewBox="0 0 16 16">
            <path d="M6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A.5.5 0 0 1 1 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06m7.137 2.096a.5.5 0 0 1 0 .708L12.207 8l1.647 1.646a.5.5 0 0 1-.708.708L11.5 8.707l-1.646 1.647a.5.5 0 0 1-.708-.708L10.793 8 9.146 6.354a.5.5 0 1 1 .708-.708L11.5 7.293l1.646-1.647a.5.5 0 0 1 .708 0"/>
          </svg>
        </button>
        <input type="range" class="ad-volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="1" aria-label="Volume" />
        <span class="ad-vol-pct" id="volPct">100%</span>
      </div>

      <div class="ad-pill-controls">
        <button type="button" class="ad-mini-pill" id="speedBtn" title="Playback Speed">1x</button>
        <button type="button" class="ad-mini-pill" id="sleepBtn" title="Sleep Timer">Sleep: Off</button>
      </div>
    </div>
  </div>

  <!-- Playlist Box with Dynamic Folder Filters -->
  <div class="ad-playlist-box">
    <div class="ad-playlist-header">
      <span id="trackCount">Loading Tracks...</span>
      <button type="button" class="ad-refresh-btn" id="refreshBtn">↻ Sync Drive</button>
    </div>

    <!-- Auto-Populated Folder Filter Chips -->
    <div class="ad-filter-bar" id="filterBar">
      <button type="button" class="ad-filter-chip active" data-cat="All">All</button>
    </div>

    <input type="text" class="ad-search-input" id="searchInput" placeholder="Search songs in playlist..." />
    <ul class="ad-track-list" id="playlistEl"></ul>
    <div class="ad-status-msg" id="statusMsg"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxPBqalX_xM8xz7XSxtSGbyW72vyZn1lXz085X3Bd2MEY665dDrMdBk2syCDRi9pCVz/exec";

    const audio = new Audio();
    const audioCache = {};
    let tracks = [];
    let currentTrackId = null;
    let activeCategory = "All";
    let isPlaying = false;
    let isShuffle = false;
    let repeatMode = 0;
    let isSeeking = false;
    let isLoadingAudio = false;
    let lastVolume = 1;

    const speeds = [1, 1.25, 1.5, 2, 0.75];
    let speedIndex = 0;

    const sleepOptions = [0, 15, 30, 60];
    let sleepIndex = 0;
    let sleepTimeout = null;

    const musicCard = document.getElementById("musicCard");
    const albumArt = document.getElementById("albumArt");
    const trackTitle = document.getElementById("trackTitle");
    const artistName = document.getElementById("artistName");
    const currentTimeEl = document.getElementById("currentTime");
    const remainingTimeEl = document.getElementById("remainingTime");
    const progressWrapper = document.getElementById("progressWrapper");
    const progressBar = document.getElementById("progressBar");
    const progressFill = document.getElementById("progressFill");
    const progressHandle = document.getElementById("progressHandle");

    const playPauseBtn = document.getElementById("playPauseBtn");
    const iconPlay = document.getElementById("iconPlay");
    const iconPause = document.getElementById("iconPause");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const rewind10Btn = document.getElementById("rewind10Btn");
    const forward10Btn = document.getElementById("forward10Btn");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const loopBtn = document.getElementById("loopBtn");
    const repeatOneBadge = document.getElementById("repeatOneBadge");

    const muteBtn = document.getElementById("muteBtn");
    const volIconHigh = document.getElementById("volIconHigh");
    const volIconMute = document.getElementById("volIconMute");
    const volumeSlider = document.getElementById("volumeSlider");
    const volPct = document.getElementById("volPct");
    const speedBtn = document.getElementById("speedBtn");
    const sleepBtn = document.getElementById("sleepBtn");

    const filterBar = document.getElementById("filterBar");
    const searchInput = document.getElementById("searchInput");
    const playlistEl = document.getElementById("playlistEl");
    const trackCount = document.getElementById("trackCount");
    const statusMsg = document.getElementById("statusMsg");
    const refreshBtn = document.getElementById("refreshBtn");

    function formatTime(sec) {
      if (isNaN(sec) || !isFinite(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? "0" : ""}${s}`;
    }

    function getFilteredTracks() {
      const query = searchInput.value.trim().toLowerCase();
      return tracks.filter(t => {
        const catMatch = activeCategory === "All" || (t.category || "").toLowerCase() === activeCategory.toLowerCase();
        const textMatch = !query || t.title.toLowerCase().includes(query);
        return catMatch && textMatch;
      });
    }

    function renderFilterChips(folderCategories = []) {
      const trackCats = tracks.map(t => t.category).filter(Boolean);
      const allCats = Array.from(new Set(["All", ...folderCategories, ...trackCats]));

      filterBar.innerHTML = "";
      allCats.forEach(cat => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `ad-filter-chip ${cat === activeCategory ? "active" : ""}`;
        btn.dataset.cat = cat;
        btn.textContent = cat;
        filterBar.appendChild(btn);
      });
    }

    function updateMediaSession(track) {
      if (!("mediaSession" in navigator) || !track) return;
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title,
          artist: `${track.artist || "AD Music"} • ${track.category || "Music"}`,
          album: "AD Music Cloud",
          artwork: track.thumb ? [{ src: track.thumb, sizes: "400x400", type: "image/jpeg" }] : []
        });

        navigator.mediaSession.setActionHandler("play", () => playPauseBtn.click());
        navigator.mediaSession.setActionHandler("pause", () => pauseTrack());
        navigator.mediaSession.setActionHandler("previoustrack", () => prevBtn.click());
        navigator.mediaSession.setActionHandler("nexttrack", () => nextBtn.click());
        navigator.mediaSession.setActionHandler("seekbackward", () => rewind10Btn.click());
        navigator.mediaSession.setActionHandler("seekforward", () => forward10Btn.click());
        navigator.mediaSession.setActionHandler("seekto", (details) => {
          if (details.seekTime !== undefined && audio.duration) {
            audio.currentTime = details.seekTime;
          }
        });
      } catch (e) {}
    }

    function callAppsScript(params = "") {
      return new Promise((resolve, reject) => {
        const callbackName = "adMusicCb_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
        const script = document.createElement("script");
        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error("Request timed out."));
        }, 25000);

        function cleanup() {
          clearTimeout(timeout);
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[callbackName] = (data) => {
          cleanup();
          resolve(data);
        };

        script.onerror = () => {
          cleanup();
          reject(new Error("Apps Script connection failed."));
        };

        const sep = SCRIPT_URL.includes("?") ? "&" : "?";
        script.src = `${SCRIPT_URL}${sep}${params ? params + "&" : ""}callback=${callbackName}`;
        document.body.appendChild(script);
      });
    }

    async function fetchDriveSongs() {
      statusMsg.style.color = "#00c6ff";
      statusMsg.textContent = "";
      trackCount.textContent = "Fetching from Drive...";
      playlistEl.innerHTML = `<li class="ad-track-item" style="justify-content:center; color:#8e8e93;">Loading playlist...</li>`;

      try {
        const data = await callAppsScript("");
        if (data && data.error) throw new Error(data.error);

        const list = Array.isArray(data) ? data : (data.tracks || []);
        const folderCats = Array.isArray(data.categories) ? data.categories : [];

        tracks = list;
        renderFilterChips(folderCats);

        if (tracks.length === 0) {
          trackTitle.textContent = "Folder Empty";
          trackCount.textContent = "0 Tracks";
          playlistEl.innerHTML = `<li class="ad-track-item" style="justify-content:center; color:#8e8e93;">Is Drive folder me abhi koi audio file nahi hai.</li>`;
          return;
        }

        selectTrackUI(tracks[0]);
      } catch (err) {
        statusMsg.style.color = "#ff6b6b";
        statusMsg.textContent = err.message;
        trackTitle.textContent = "Connection Failed";
        trackCount.textContent = "0 Tracks";
        playlistEl.innerHTML = "";
      }
    }

    function updateAlbumArt(thumbUrl) {
      if (thumbUrl) {
        albumArt.innerHTML = `<img src="${thumbUrl}" alt="Cover" onerror="this.parentElement.innerHTML='AD';" />`;
      } else {
        albumArt.innerHTML = "AD";
      }
    }

    function renderPlaylist() {
      const visibleTracks = getFilteredTracks();
      playlistEl.innerHTML = "";
      trackCount.textContent = `${activeCategory} (${visibleTracks.length} Tracks)`;

      if (visibleTracks.length === 0) {
        playlistEl.innerHTML = `<li class="ad-track-item" style="justify-content:center; color:#8e8e93;">Is folder/category me koi gaana nahi hai.</li>`;
        return;
      }

      visibleTracks.forEach((track, idx) => {
        const isCurrent = track.id === currentTrackId;
        const li = document.createElement("li");
        li.className = `ad-track-item ${isCurrent ? "active" : ""}`;
        const thumbHtml = track.thumb
          ? `<img src="${track.thumb}" alt="" onerror="this.parentElement.innerHTML='AD';" />`
          : `AD`;

        li.innerHTML = `
          <div class="ad-item-thumb">${thumbHtml}</div>
          <div style="flex-grow:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
            <div style="font-weight:600; overflow:hidden; text-overflow:ellipsis;">${track.title}</div>
            <div style="font-size:0.75rem; color:#8e8e93;">
              ${track.artist}
              <span class="ad-cat-tag">${track.category || "Music"}</span>
            </div>
          </div>
          <span class="ad-track-item-meta">${isCurrent && isPlaying ? "Playing" : `#${idx + 1}`}</span>
        `;
        li.addEventListener("click", () => {
          loadAndPlayTrack(track);
        });
        playlistEl.appendChild(li);
      });
    }

    function selectTrackUI(track) {
      if (!track) return;
      currentTrackId = track.id;
      trackTitle.textContent = track.title;
      artistName.textContent = `${track.artist} • ${track.category || "Music"}`;
      updateAlbumArt(track.thumb);
      progressFill.style.width = "0%";
      progressHandle.style.left = "0%";
      currentTimeEl.textContent = "0:00";
      remainingTimeEl.textContent = "-0:00";
      renderPlaylist();
      updateMediaSession(track);
    }

    async function preloadTrack(track) {
      if (!track || audioCache[track.id]) return;
      try {
        const res = await callAppsScript(`fileId=${encodeURIComponent(track.id)}`);
        if (res && res.base64) {
          const byteChars = atob(res.base64);
          const byteNumbers = new Array(byteChars.length);
          for (let i = 0; i < byteChars.length; i++) {
            byteNumbers[i] = byteChars.charCodeAt(i);
          }
          const blob = new Blob([new Uint8Array(byteNumbers)], { type: res.mimeType || "audio/webm" });
          audioCache[track.id] = URL.createObjectURL(blob);
        }
      } catch (e) {}
    }

    async function loadAndPlayTrack(track) {
      if (!track || isLoadingAudio) return;
      pauseTrack();
      selectTrackUI(track);

      try {
        isLoadingAudio = true;
        statusMsg.style.color = "#00c6ff";
        statusMsg.textContent = "Buffering audio from Drive...";

        let blobUrl = audioCache[track.id];
        if (!blobUrl) {
          const res = await callAppsScript(`fileId=${encodeURIComponent(track.id)}`);
          if (res.error) throw new Error(res.error);

          const byteChars = atob(res.base64);
          const byteNumbers = new Array(byteChars.length);
          for (let i = 0; i < byteChars.length; i++) {
            byteNumbers[i] = byteChars.charCodeAt(i);
          }
          const blob = new Blob([new Uint8Array(byteNumbers)], { type: res.mimeType || "audio/webm" });
          blobUrl = URL.createObjectURL(blob);
          audioCache[track.id] = blobUrl;
        }

        audio.src = blobUrl;
        audio.playbackRate = speeds[speedIndex];
        await audio.play();
        isPlaying = true;
        statusMsg.textContent = "";
        musicCard.classList.add("is-playing");
        iconPlay.style.display = "none";
        iconPause.style.display = "block";
        if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
        renderPlaylist();

        const nextTrack = getNextTrack();
        if (nextTrack) preloadTrack(nextTrack);
      } catch (err) {
        statusMsg.style.color = "#ff6b6b";
        statusMsg.textContent = "Play error: " + err.message;
      } finally {
        isLoadingAudio = false;
      }
    }

    function pauseTrack() {
      audio.pause();
      isPlaying = false;
      musicCard.classList.remove("is-playing");
      iconPlay.style.display = "block";
      iconPause.style.display = "none";
      if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
      renderPlaylist();
    }

    function getNextTrack() {
      const list = getFilteredTracks();
      if (list.length === 0) return null;
      const idx = list.findIndex(t => t.id === currentTrackId);

      if (isShuffle && list.length > 1) {
        let rand;
        do {
          rand = Math.floor(Math.random() * list.length);
        } while (rand === idx);
        return list[rand];
      }
      const nextIdx = idx === -1 ? 0 : (idx + 1) % list.length;
      return list[nextIdx];
    }

    function getPrevTrack() {
      const list = getFilteredTracks();
      if (list.length === 0) return null;
      const idx = list.findIndex(t => t.id === currentTrackId);
      const prevIdx = idx <= 0 ? list.length - 1 : idx - 1;
      return list[prevIdx];
    }

    filterBar.addEventListener("click", (e) => {
      const chip = e.target.closest(".ad-filter-chip");
      if (!chip) return;
      document.querySelectorAll(".ad-filter-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      activeCategory = chip.dataset.cat;
      renderPlaylist();
    });

    playPauseBtn.addEventListener("click", () => {
      if (tracks.length === 0) return;
      if (isPlaying) {
        pauseTrack();
      } else if (audio.src && audio.src.startsWith("blob:")) {
        audio.play().then(() => {
          isPlaying = true;
          musicCard.classList.add("is-playing");
          iconPlay.style.display = "none";
          iconPause.style.display = "block";
          if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
          renderPlaylist();
        });
      } else {
        const current = tracks.find(t => t.id === currentTrackId) || getFilteredTracks()[0] || tracks[0];
        loadAndPlayTrack(current);
      }
    });

    prevBtn.addEventListener("click", () => {
      if (audio.currentTime > 4) {
        audio.currentTime = 0;
        return;
      }
      const prev = getPrevTrack();
      if (prev) loadAndPlayTrack(prev);
    });

    nextBtn.addEventListener("click", () => {
      const next = getNextTrack();
      if (next) loadAndPlayTrack(next);
    });

    rewind10Btn.addEventListener("click", () => {
      if (!audio.duration) return;
      audio.currentTime = Math.max(0, audio.currentTime - 10);
    });

    forward10Btn.addEventListener("click", () => {
      if (!audio.duration) return;
      audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
    });

    shuffleBtn.addEventListener("click", () => {
      isShuffle = !isShuffle;
      shuffleBtn.classList.toggle("active-state", isShuffle);
    });

    loopBtn.addEventListener("click", () => {
      repeatMode = (repeatMode + 1) % 3;
      audio.loop = repeatMode === 2;
      loopBtn.classList.toggle("active-state", repeatMode > 0);
      repeatOneBadge.style.display = repeatMode === 2 ? "flex" : "none";
      const labels = ["Repeat: Off", "Repeat: All", "Repeat: One"];
      loopBtn.title = labels[repeatMode];
    });

    function updateVolumeUI(val) {
      audio.volume = val;
      volumeSlider.value = val;
      volPct.textContent = `${Math.round(val * 100)}%`;
      const muted = val === 0 || audio.muted;
      volIconHigh.style.display = muted ? "none" : "block";
      volIconMute.style.display = muted ? "block" : "none";
    }

    volumeSlider.addEventListener("input", (e) => {
      const val = parseFloat(e.target.value);
      audio.muted = false;
      if (val > 0) lastVolume = val;
      updateVolumeUI(val);
    });

    muteBtn.addEventListener("click", () => {
      if (audio.muted || audio.volume === 0) {
        audio.muted = false;
        updateVolumeUI(lastVolume || 1);
      } else {
        lastVolume = audio.volume;
        audio.muted = true;
        updateVolumeUI(0);
      }
    });

    speedBtn.addEventListener("click", () => {
      speedIndex = (speedIndex + 1) % speeds.length;
      const newSpeed = speeds[speedIndex];
      audio.playbackRate = newSpeed;
      speedBtn.textContent = `${newSpeed}x`;
      speedBtn.classList.toggle("active", newSpeed !== 1);
    });

    sleepBtn.addEventListener("click", () => {
      sleepIndex = (sleepIndex + 1) % sleepOptions.length;
      const mins = sleepOptions[sleepIndex];
      if (sleepTimeout) clearTimeout(sleepTimeout);

      if (mins === 0) {
        sleepBtn.textContent = "Sleep: Off";
        sleepBtn.classList.remove("active");
      } else {
        sleepBtn.textContent = `Sleep: ${mins}m`;
        sleepBtn.classList.add("active");
        sleepTimeout = setTimeout(() => {
          pauseTrack();
          sleepIndex = 0;
          sleepBtn.textContent = "Sleep: Off";
          sleepBtn.classList.remove("active");
          statusMsg.textContent = "Sleep timer ended. Playback paused.";
        }, mins * 60 * 1000);
      }
    });

    searchInput.addEventListener("input", renderPlaylist);

    refreshBtn.addEventListener("click", () => {
      pauseTrack();
      fetchDriveSongs();
    });

    audio.addEventListener("timeupdate", () => {
      if (!audio.duration || isSeeking) return;
      const percent = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = `${percent}%`;
      progressHandle.style.left = `${percent}%`;
      currentTimeEl.textContent = formatTime(audio.currentTime);
      remainingTimeEl.textContent = `-${formatTime(audio.duration - audio.currentTime)}`;
    });

    audio.addEventListener("ended", () => {
      if (repeatMode === 2) return;
      const list = getFilteredTracks();
      const idx = list.findIndex(t => t.id === currentTrackId);
      if (repeatMode === 1 || idx < list.length - 1 || isShuffle) {
        const next = getNextTrack();
        if (next) loadAndPlayTrack(next);
      } else {
        pauseTrack();
      }
    });

    function updateSeekPosition(clientX) {
      if (!audio.duration) return;
      const rect = progressBar.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      const percent = ratio * 100;
      progressFill.style.width = `${percent}%`;
      progressHandle.style.left = `${percent}%`;
      currentTimeEl.textContent = formatTime(ratio * audio.duration);
      remainingTimeEl.textContent = `-${formatTime(audio.duration - ratio * audio.duration)}`;
      return ratio * audio.duration;
    }

    progressWrapper.addEventListener("pointerdown", (e) => {
      if (!audio.duration) return;
      isSeeking = true;
      progressWrapper.setPointerCapture(e.pointerId);
      updateSeekPosition(e.clientX);
    });

    progressWrapper.addEventListener("pointermove", (e) => {
      if (!isSeeking) return;
      updateSeekPosition(e.clientX);
    });

    progressWrapper.addEventListener("pointerup", (e) => {
      if (!isSeeking) return;
      const newTime = updateSeekPosition(e.clientX);
      if (newTime !== undefined) audio.currentTime = newTime;
      isSeeking = false;
    });

    document.addEventListener("keydown", (e) => {
      if (document.activeElement === searchInput) return;
      if (e.code === "Space") {
        e.preventDefault();
        playPauseBtn.click();
      } else if (e.code === "ArrowLeft") {
        rewind10Btn.click();
      } else if (e.code === "ArrowRight") {
        forward10Btn.click();
      } else if (e.key.toLowerCase() === "m") {
        muteBtn.click();
      }
    });

    fetchDriveSongs();
  </script>
</body>
</html>
